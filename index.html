<style>
/* Layout: logo header + diner checker strip, tabbed POS app; bottom nav on phone, top nav on desktop */
:root{
  --bg:#FFF7F3; --surface:#FFFFFF; --ink:#24171A; --muted:#7B6669; --line:#F1DFDA;
  --red:#C8202B; --red-ink:#A3141E; --red-soft:#FDECEA;
  --mustard:#F2B134; --mustard-soft:#FFF3D6;
  --green:#1D7F4A; --green-soft:#E2F4E9; --amber:#9A5A00; --amber-soft:#FFF0D9;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(var(--mustard-soft) 1.6px, transparent 1.7px);background-size:26px 26px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,a,label,input,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.25rem} h3{font-size:1.02rem}
.muted{color:var(--muted)} .small{font-size:.85rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted)}

/* header */
.top{background:var(--surface);position:relative;z-index:5}
.topin{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{height:46px;width:auto;display:block}
.day{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.day input{border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--surface);font-weight:700}
.checker{height:10px;background:conic-gradient(var(--red) 25%,#fff 0 50%,var(--red) 0 75%,#fff 0) 0 0/20px 20px;border-bottom:1px solid var(--line)}
.iconbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:800;border-radius:99px;padding:3px 10px;background:var(--red-soft);color:var(--red-ink);white-space:nowrap}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.chip.gray{background:#F4ECEA;color:var(--muted)}
.chip.y{background:var(--mustard-soft);color:#7A5200}

/* nav */
.nav{display:flex;gap:4px}
.nav button{border:0;background:none;padding:10px 14px;border-radius:12px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:8px}
.nav button svg{width:20px;height:20px}
.nav button[aria-current="true"]{background:var(--red);color:#fff}
@media (min-width:900px){.navbar{position:sticky;top:0;z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding-block:8px}}
@media (max-width:899px){
  .navbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 20px rgba(60,20,20,.06)}
  .navbar .wrap{padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
  .nav{justify-content:space-around}
  .nav button{flex-direction:column;gap:2px;font-size:min(.68rem,3vw);padding:8px 1px;flex:1 1 0;min-width:0;border-radius:10px;line-height:1.15;white-space:normal;word-break:normal;overflow:hidden;text-align:center}
  main#view{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
  main#view:has(.cartbar){padding-bottom:calc(180px + env(safe-area-inset-bottom,0px))}
  .logo{height:38px}
}
main{padding-block:18px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.hero{background:var(--red);color:#fff;border-radius:18px;padding:18px 20px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;position:relative;overflow:hidden}
.hero>*{position:relative;z-index:1}
.hero::after{pointer-events:none;content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:radial-gradient(#fff3 1.5px,transparent 1.6px) 0 0/14px 14px}
.hero .label{color:#ffe1dd}
.hero .big{font-family:var(--f-display);font-size:2.2rem;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:800;background:var(--red);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--red-ink)}
.btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.sec:hover{border-color:var(--red);color:var(--red-ink)}
.btn.y{background:var(--mustard);color:#3A2600}
.btn.ghost{background:none;color:var(--red-ink);padding:6px 8px}
.btn.big{padding:14px 18px;font-size:1.05rem;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.list{display:flex;flex-direction:column}
.li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1 1 170px;min-width:0}
.li .t{font-weight:700;overflow-wrap:anywhere}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--red-ink)} .pos{color:var(--green)}
.empty{padding:18px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}
.banner{border-radius:12px;padding:10px 14px;background:var(--amber-soft);color:#5E3800;font-weight:600}
.banner.red{background:var(--red-soft);color:var(--red-ink)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.r,th.r{text-align:right}

/* POS */
.posgrid{display:grid;gap:16px}
.posgrid>*{min-width:0}
.opgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.htabs button{padding:10px 8px;font-size:1rem}
.rl3{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:6px}.rl2{display:grid;grid-template-columns:1.3fr 1fr;gap:6px}
.rl3 .f input,.rl3 .f select,.rl2 .f input,.rl2 .f select{padding:8px 9px}
.sbars{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:8px}
.sbars .sbar{flex:1;min-width:0;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden;background:var(--line)}
.sbars .sbar span{display:block;width:100%}
.sbars.lbl{height:auto;padding:0}.sbars.lbl div{flex:1;text-align:center;font-size:.75rem;color:var(--muted);font-weight:700}
.tools{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:899px){.tools{display:grid;grid-template-columns:1fr 1fr;width:100%}.tools .btn{padding:10px 8px}}
@media (min-width:900px){.posgrid{grid-template-columns:minmax(0,1fr) 390px;align-items:start}.cart{position:sticky;top:76px}}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--surface)}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.cats button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:800;white-space:nowrap}
.cats button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
.tile{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile.fold{border-width:2px;border-color:var(--ink);padding-right:30px}
.tile.fold .ch{position:absolute;right:10px;bottom:10px;font-weight:900;transition:transform .22s ease}
.tile.fold .p{color:var(--muted);font-size:.8rem}
.tile.fold[aria-expanded="true"]{background:var(--ink);color:#fff}
.tile.fold[aria-expanded="true"] .p{color:#fff;opacity:.85}
.tile.fold[aria-expanded="true"] .ch{transform:rotate(180deg)}
.fpanel{grid-column:1/-1;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));padding:10px;border:2px solid var(--ink);border-radius:14px;transform-origin:top center;animation:fopen .24s ease-out}
.fpanel .tile{min-height:72px}
.fpanel .fedit{grid-column:1/-1;justify-self:end;padding:4px 8px}
@keyframes fopen{from{opacity:0;transform:scaleY(.8) translateY(-8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fpanel{animation:none}.tile.fold .ch{transition:none}}
.tile:hover{border-color:var(--red)}
.tile .n{font-weight:800;line-height:1.2}
.tile .ic{font-size:1.45rem;line-height:1;display:block;margin-bottom:2px}
.isearch{display:flex;gap:8px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:0 10px}
.isearch input{border:0;outline:0;background:transparent;padding:10px 0;flex:1;min-width:0;font:inherit;color:inherit}
.isearch button{border:0;background:none;font-size:1.1rem;color:var(--muted);padding:4px}
.icats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.icats::-webkit-scrollbar{display:none}
.icats button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 11px;font-weight:700;font-size:.85rem;white-space:nowrap}
.icats.wrap{flex-wrap:wrap}
.fab{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:18;background:var(--red);color:#fff;border:0;border-radius:99px;padding:13px 18px;font:inherit;font-weight:800;font-size:1rem;box-shadow:0 8px 22px rgba(160,20,30,.35);display:flex;align-items:center;gap:6px}
.fab:active{transform:scale(.97)}
@media (min-width:900px){.fab{bottom:24px;right:24px}}
.omas{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;width:100%;padding:8px;border:1.5px dashed var(--line);border-radius:12px}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:4px}
.who button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800;color:var(--ink);font:inherit;font-weight:800}
.who button[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft)}
.who .av{width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:1.05rem}
.who button[data-rol="admin"] .av{background:var(--red)}.who button[data-rol="supervisor"] .av{background:#1C5A9E}
.who small{color:var(--muted);font-weight:600;font-size:.72rem}
.lockbox .linkb{background:none;border:0;color:var(--red-ink);font-weight:700;padding:4px;font:inherit;font-weight:700;cursor:pointer}
.yochip{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rolpill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:.72rem;font-weight:800;background:var(--line);color:var(--ink)}
.rolpill.admin{background:var(--red);color:#fff}.rolpill.supervisor{background:#DCEAF8;color:#1C5A9E}
.aud .li{align-items:flex-start}.aud .det{font-size:.75rem;color:var(--muted);word-break:break-word;margin-top:2px}
.icats button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tile .p{font-weight:800;color:var(--red-ink);font-variant-numeric:tabular-nums;font-size:.92rem}
.tile .p.zero{color:var(--amber);font-size:.78rem}
.tile .q{position:absolute;top:-8px;right:-6px;background:var(--red);color:#fff;border-radius:99px;min-width:26px;height:26px;display:grid;place-items:center;font-weight:800;font-size:.85rem;border:2px solid var(--surface)}
.tile.cat-Bebida{border-bottom:4px solid #3A8DDE}
.tile.cat-Adicional{border-bottom:4px solid var(--mustard)}
.tile.cat-Comida{border-bottom:4px solid var(--red)}
.cline{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{border:0;background:var(--bg);width:32px;height:32px;font-weight:800;font-size:1.1rem}
.qty span{min-width:28px;text-align:center;font-weight:800}
.pays{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:6px}
.pays button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 2px;font-weight:800;font-size:.82rem}
.pays button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f input,.f select,.f textarea{border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface);width:100%}
.f input:focus,.f select:focus,.f textarea:focus,.search input:focus{border-color:var(--red);outline:none}
.fgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.total{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);font-size:1.5rem;font-weight:800}
.cartbar{display:none}
@media (max-width:899px){
  .cart{display:none}
  .cart.open{display:block;position:fixed;inset:0;z-index:30;overflow:auto;border-radius:0;border:0;
    padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .cartbar{display:flex;position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
    bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:19;border-radius:14px;padding:12px 16px;justify-content:space-between;box-shadow:0 8px 24px rgba(160,20,30,.3)}
}
.nav button{position:relative}
.nav .badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--mustard);color:#3A2600;border-radius:99px;font-size:.7rem;font-weight:800;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--surface)}
.nav .badge.cob{right:auto;left:calc(50% - 30px);background:var(--red);color:#fff}
.cobchip{background:var(--red);color:#fff;border:2px solid var(--red-ink);font-weight:800;animation:cobpulse 1.6s ease-in-out infinite}
@keyframes cobpulse{0%,100%{box-shadow:0 0 0 0 rgba(200,32,43,.55)}50%{box-shadow:0 0 0 7px rgba(200,32,43,0)}}
@media (prefers-reduced-motion:reduce){.cobchip{animation:none}}
@media (min-width:900px){.nav .badge{position:static;border:0}}
.schips{display:flex;flex-wrap:wrap;gap:8px}
.schip{border:1.5px solid var(--line);border-radius:99px;padding:7px 14px;font-weight:800;background:var(--surface)}
.schip[aria-pressed="true"]{background:var(--mustard);border-color:var(--mustard);color:#3A2600}
.sbtn{border:0;background:none;padding:0;color:#7A5200;font-weight:700;font-size:.82rem;text-align:left}
.orders{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.ord{background:var(--surface);border:1.5px solid var(--line);border-top:6px solid var(--mustard);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ord.late{border-top-color:var(--red)}
.ord.next{border-color:var(--red);box-shadow:0 6px 18px rgba(200,32,43,.15)}
.ord.cobrar{border-top-color:#3A8DDE}
.ord .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ord .acts.one{grid-template-columns:1fr}
.sigue{background:var(--red);color:#fff;border-radius:8px;padding:2px 8px;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.ord .no{font-family:var(--f-display);font-size:1.5rem;font-weight:800}
.ord ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.ord li b{font-size:1.02rem}
.ord .sal{display:block;color:#7A5200;font-weight:700;font-size:.88rem}
.ord .nt{background:var(--mustard-soft);border-radius:10px;padding:8px 10px;font-weight:700}
.seg.full{width:100%}.seg.full button{flex:1}
.mesas{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mesas button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 0;font-weight:800}
.mesas button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.olist{display:flex;flex-direction:column;gap:8px}
.orow{background:var(--surface);border:1.5px solid var(--line);border-left:6px solid var(--mustard);border-radius:12px;overflow:hidden}
.orow.next{border-color:var(--red);border-left-color:var(--red)}
.orow.late{border-left-color:var(--red-ink)}
.orow.llevar{border-left-color:#3A8DDE}
.orow.cobrar{border-left-color:#3A8DDE}
.ohead{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;background:none;border:0;text-align:left}
.ohead .no{font-family:var(--f-display);font-weight:800;font-size:1.25rem;min-width:38px}
.ohead{flex-wrap:wrap}.ohead .grow{flex:1 1 170px;min-width:0}
.ohead .t{font-weight:800;overflow-wrap:anywhere;line-height:1.3}
.caret{color:var(--muted);transition:transform .15s}
.orow.open .caret{transform:rotate(180deg)}
.obody{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:10px}
.obody ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.obody .sal{display:block;color:#7A5200;font-weight:700;font-size:.88rem}
.obody .nt{background:var(--mustard-soft);border-radius:10px;padding:8px 10px;font-weight:700}
.cobra{border-radius:12px;padding:10px 12px;font-weight:800;font-size:1.05rem;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cobra.no{background:var(--red-soft);color:var(--red-ink);border:2px solid var(--red)}
.cobra.si{background:var(--green-soft);color:var(--green);border:2px solid var(--green)}
.cobra .num{font-family:var(--f-display);font-size:1.4rem}
.entrega{background:#EAF3FC;border:2px solid #3A8DDE;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.entrega .quien{font-family:var(--f-display);font-weight:800;font-size:1.2rem;line-height:1.2}
.entrega .dir{font-weight:800;font-size:1.15rem;line-height:1.3;overflow-wrap:anywhere}
.entrega .lnk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.entrega .lnk a{display:flex;align-items:center;justify-content:center;gap:4px;min-height:44px;border-radius:10px;background:#fff;border:1.5px solid #3A8DDE;color:#1C5A9E;font-weight:800;text-decoration:none;font-size:.92rem}
.obody .it{font-size:1.02rem}
.obody .tag{display:inline-block;margin:3px 4px 0 0;padding:2px 8px;border-radius:8px;font-weight:800;font-size:.9rem}
.obody .tag.sin{background:var(--red);color:#fff}
.obody .tag.con{background:#1C5A9E;color:#fff}
.obody .tag.sal{background:var(--mustard-soft);color:#7A5200}
.ohead .dirh{display:block;font-weight:700;color:#1C5A9E;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.obody .acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.fold>.fhead{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.fold>.fhead h2,.fold>.fhead h3{flex:1}
.fold.open>.fhead .caret{transform:rotate(180deg)}
.stockchip{background:var(--red);color:#fff}
#ticket{display:none}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.chk:first-child{border-top:0}
.chk .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;background:var(--green-soft);color:var(--green)}
.chk.bad .ic{background:var(--red-soft);color:var(--red-ink)}
.pista{background:var(--mustard-soft);border-radius:10px;padding:8px 10px;font-size:.9rem}
@media print{
  @page{margin:0;size:auto}
  html,body{background:#fff!important;background-image:none!important}
  body.printing>*:not(#ticket){display:none!important}
  body.printing #ticket{display:block!important}
}
#ticket{font-family:"Courier New",ui-monospace,monospace;color:#000;background:#fff;font-size:12px;line-height:1.35;padding:2mm 3mm}
#ticket .c{text-align:center}#ticket .b{font-weight:700}#ticket .xl{font-size:18px;font-weight:700}
#ticket hr{border:0;border-top:1px dashed #000;margin:4px 0}
#ticket table{width:100%;border-collapse:collapse}#ticket td{padding:1px 0;white-space:normal;border:0;vertical-align:top}#ticket td.r{text-align:right;white-space:nowrap}
#ticket img{width:60%;max-width:46mm;filter:grayscale(1) contrast(1.4);display:block;margin:0 auto 2px}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:8px}
.bars div{flex:1;background:var(--red);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars div:hover{background:var(--mustard)}
.seg{display:flex;gap:4px;background:#F4ECEA;border-radius:12px;padding:4px;width:max-content;max-width:100%}
.seg button{border:0;background:none;border-radius:9px;padding:7px 14px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* modal + toast + lock */
.modal{position:fixed;inset:0;z-index:50;background:rgba(36,23,26,.45);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.modal{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;border-radius:20px 20px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet{border-radius:20px}}
.sheet header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px)}
.toast.err{background:var(--red-ink)}
@media (min-width:900px){.toast{bottom:24px}}
.lock{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));
  background-image:radial-gradient(var(--mustard-soft) 1.6px, transparent 1.7px);background-size:26px 26px}
.lockbox{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;text-align:center}
.lockbox img{height:70px;margin:0 auto}
.rline{display:grid;grid-template-columns:minmax(0,1fr) 90px 34px;gap:6px;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  return `<div class="stack">
  <div class="hero"><div><div class="label">${fDate(S.date,true)} · ${esc(S.yo?.nombre||"")}</div><div class="big" style="font-size:1.6rem">${closed?"Día cerrado":"Caja abierta"}</div><div class="small" style="color:#ffe1dd">${c.sales.length} ${c.sales.length===1?"pedido":"pedidos"} hoy</div></div>
    <div class="row"><button class="btn y" data-a="cierre">${closed?"Ver cierre":"Finalizar el día"}</button></div></div>
  ${pend&&pend!==S.date?`<div class="banner">El ${fDate(pend,true)} quedó sin cerrar. <button class="btn ghost" data-a="goDay" data-v="${pend}">Ir a cerrarlo</button></div>`:""}
  <section class="card stack"><div class="row between"><h2>Gastos y compras de hoy</h2></div>
   ${L.length?`<div class="list">${L.map(x=>`<div class="li"><span class="chip ${x.t==="Compra"?"ok":"gray"}">${x.t==="Compra"?"📦":"🧾"} ${x.t}</span><div class="grow"><div class="t">${esc(x.n)}</div><div class="small muted">${esc(x.h||"")}${x.o.proveedor?" · "+esc(x.o.proveedor):""}${porTxt(x.o)}</div></div><b class="amt">${money(x.v)}</b></div>`).join("")}</div>`:`<div class="empty">Aquí aparece lo que se compre o se pague hoy.</div>`}
   <p class="small muted" style="margin:0">Si algo quedó mal, avísale a un supervisor o a Admin para que lo corrija.</p></section></div>`}

    <div class="row">${closed?`<span class="chip ok">Día finalizado</span>`:""}${closed?`<button class="btn y" data-a="cierre">Ver cierre</button>`:d.ventasCerradas?`<button class="btn y" data-a="cierre">2 · Cerrar caja</button><button class="btn sec" data-a="reabrirV" style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.4)">🔓 Reabrir ventas</button>`:`<button class="btn y" data-a="cierre">1 · Cerrar ventas</button>`}</div></div>

 const pTxt=gp==="dia"?fDate(gd,true):gp==="semana"?`Semana del ${fDate(days[0])} al ${fDate(days[6])}`:(()=>{const [y,m]=month.split("-").map(Number);return `${MESL[m-1]} ${y}`})();

function vHist(){
  const keys=Object.keys(S.days).sort();const months=[...new Set(keys.map(k=>k.slice(0,7)))].reverse();
  if(!months.length)return `<div class="empty">Aún no hay días registrados.</div>`;
  if(!S.month||!months.includes(S.month))S.month=months[0];
  const mk=keys.filter(k=>k.startsWith(S.month));const cs=mk.map(k=>({k,...calcDay(k)}));
  const sum=f=>cs.reduce((a,c)=>a+f(c),0);
  const tot={ventas:sum(c=>c.ventas),dom:sum(c=>c.dom),tg:sum(c=>c.tg),tc:sum(c=>c.tc),tInv:sum(c=>c.tInv),tw:sum(c=>c.tw),perd:sum(c=>c.perdidas),bal:sum(c=>c.balance)};
  const mx=Math.max(1,...cs.map(c=>c.ventas));
  const [y,m]=S.month.split("-").map(Number);const dim=new Date(Date.UTC(y,m,0)).getUTCDate();
  const hp=S.histPer||"mes";const hd=S.histDia||(mk[mk.length-1]||S.date);
  const sumD=(k,n)=>{const [yy,mm,dd]=k.split("-").map(Number);return new Date(Date.UTC(yy,mm-1,dd+n)).toISOString().slice(0,10)};
  const dow=k=>{const [yy,mm,dd]=k.split("-").map(Number);return (new Date(Date.UTC(yy,mm-1,dd)).getUTCDay()+6)%7};
  const l0=sumD(hd,-dow(hd)),l6=sumD(l0,6);const pk=hp==="dia"?[hd]:hp==="semana"?keys.filter(k=>k>=l0&&k<=l6):mk;
  const pTxt=hp==="dia"?fDate(hd,true):hp==="semana"?`Semana del ${fDate(l0)} al ${fDate(l6)}`:`${MESL[m-1]} ${y}`;
  const sold=soldOn(pk),verTodo=!!S.fold.histTodo,top=verTodo?sold:sold.slice(0,10),tUn=sold.reduce((a,x)=>a+x.qty,0),tVal=sold.reduce((a,x)=>a+x.total,0);

  if(hTab==="gastos")return `<div class="stack">${head}${vGastosMes(S.month,mk[mk.length-1]||S.date)}</div>`;
  return `<div class="stack">${head}
  <div class="hero"><div><div class="label">Balance de ${MESL[m-1]}</div><div class="big">${money(tot.bal)}</div><div class="small" style="color:#ffe1dd">${cs.length} días con movimiento</div></div></div>
  <div class="kpis"><div class="kpi"><span class="label">Ventas</span><b>${money(tot.ventas)}</b></div><div class="kpi"><span class="label">Domicilios</span><b>${money(tot.dom)}</b></div>
   <div class="kpi"><span class="label">Gastos</span><b>${money(tot.tg)}</b></div><div class="kpi"><span class="label">Compras</span><b>${money(tot.tc)}</b></div>${tot.tInv?`<div class="kpi"><span class="label">Inversión inventario</span><b>${money(tot.tInv)}</b></div>`:""}<div class="kpi"><span class="label">Trabajadores</span><b>${money(tot.tw)}</b></div>${tot.perd?`<div class="kpi"><span class="label">Pérdidas (no vendido)</span><b>${money(tot.perd)}</b></div>`:""}</div>

function mCarpeta(id){const C=clone(carpetas());const c=C.find(x=>x.id===id)||{id:uid("c"),n:"",pids:[]};const isNew=!C.some(x=>x.id===c.id);
 const act=S.products.filter(p=>p.activo!==false).sort((a,b)=>(c.pids.includes(b.id)-c.pids.includes(a.id))||a.name.localeCompare(b.name,"es"));
 openModal(isNew?"Nueva carpeta":"Editar carpeta",`<form class="stack" id="fm"><div class="fgrid" style="grid-template-columns:1fr 92px"><label class="f"><span class="label">Nombre de la carpeta</span><input id="c_n" value="${esc(c.n)}" placeholder="Ej. Salchipapas" required></label><label class="f"><span class="label">Ícono</span><input id="c_e" value="${esc(c.e||"")}" placeholder="${icoC({n:c.n||"x"})}" maxlength="8" style="text-align:center;font-size:1.3rem"></label></div>

  <input id="c_q" placeholder="Buscar producto…" autocomplete="off" style="border:1.5px solid var(--line);border-radius:12px;padding:10px 12px">
  <div class="list" id="c_l">${act.map(p=>{const o=carpetaDe(p.id);const otra=o&&o.id!==c.id;return `<label class="li" data-nm="${esc(norm(p.name))}"><input type="checkbox" value="${p.id}" ${c.pids.includes(p.id)?"checked":""}><div class="grow"><div class="t">${esc(p.name)}</div><div class="small muted">${+p.price>0?money(p.price):"Sin precio"}${otra?` · está en «${esc(o.n)}», se pasa aquí`:""}</div></div></label>`}).join("")}</div>
  <button class="btn big">Guardar carpeta</button>${isNew?"":`<button type="button" class="btn ghost" id="c_del" style="color:var(--red-ink)">Borrar carpeta (los productos quedan sueltos)</button>`}</form>`,sh=>{

  if(!c.n){const sug=()=>{const L=[...sh.querySelectorAll("#c_l input:checked")].map(i=>prod(i.value));if(L.length&&!$("#c_n",sh).dataset.t){const w=L[0].name.trim().split(/\s+/)[0];if(L.every(p=>norm(p.name.split(/\s+/)[0]).replace(/(es|s)$/,"")===norm(w).replace(/(es|s)$/,"")))$("#c_n",sh).value=plural(w)}};$("#c_l",sh).addEventListener("change",sug);$("#c_n",sh).oninput=()=>$("#c_n",sh).dataset.t=1}
  $("#c_q",sh).oninput=e=>{const q=norm(e.target.value);sh.querySelectorAll("#c_l .li").forEach(li=>li.hidden=!!q&&!fuzzy(li.dataset.nm,q))};
  if($("#c_del",sh))$("#c_del",sh).onclick=()=>{S.cfg={...cfg(),carpetas:C.filter(x=>x.id!==c.id)};if(S.fopen===c.id)S.fopen=null;saveCfg();toast("Carpeta borrada");mCarpetas()};
  $("#fm",sh).onsubmit=e=>{e.preventDefault();const n=$("#c_n",sh).value.trim();const ce=$("#c_e",sh).value.trim();const pids=[...sh.querySelectorAll("#c_l input:checked")].map(i=>i.value);
   if(!n)return toast("Ponle un nombre a la carpeta.",true);if(!pids.length)return toast("Marca al menos un producto.",true);
   const keep=c.pids.filter(x=>pids.includes(x));pids.forEach(x=>{if(!keep.includes(x))keep.push(x)});
   let N=C.map(x=>x.id===c.id?x:{...x,pids:(x.pids||[]).filter(p=>!pids.includes(p))});if(isNew)N.push({id:c.id,n,e:ce,pids:keep});else N=N.map(x=>x.id===c.id?{...x,n,e:ce,pids:keep}:x);
   S.cfg={...cfg(),carpetas:N};S.fopen=c.id;saveCfg();toast("Carpeta guardada");mCarpetas()}})}
function mBebidas(){const act=S.insumos.filter(i=>i.activo!==false&&i.unit==="unidad").sort((a,b)=>a.name.localeCompare(b.name,"es"));
 const rows=act.map(i=>{const uo=opcUso(i.id);const ya=uo?{name:`${uo.p.name} (${uo.o.n})`}:S.products.find(p=>p.activo!==false&&(p.receta||[]).length===1&&p.receta[0].iid===i.id&&!(p.incluye||[]).length);const sim=ya?null:bestMatch(i.name,S.products.filter(p=>!(p.incluye||[]).length&&!((p.receta||[]).length>1)&&!S.products.some(o=>o!==p&&false)));
  return{i,ya,sim,on:!ya&&DRINK.test(norm(i.name)),price:ya?+ya.price||"":sim?+sim.price||"":""}});
 openModal("Bebidas del inventario a la venta",`<form class="stack" id="fm"><p class="small muted" style="margin:0">Estos son los insumos que se cuentan por <b>unidades</b>. Marca los que se venden tal cual (gaseosas, jugos, agua…). Cada uno queda como producto en la categoría <b>Bebida</b> y al venderlo descuenta 1 unidad del inventario.</p>
  ${rows.length?`<div class="list" id="bb">${rows.map((r,k)=>`<div class="li"><input type="checkbox" data-bk="${k}" ${r.on?"checked":""} ${r.ya?"disabled":""} aria-label="Vender ${esc(r.i.name)}"><div class="grow"><div class="t">${esc(r.i.name)}</div><div class="small ${r.ya?"pos":"muted"}">${r.ya?`✓ Ya está a la venta como «${esc(r.ya.name)}»`:r.sim?`Se conecta con el producto «${esc(r.sim.name)}»`:"Se crea como producto nuevo"}</div></div>${r.ya?"":`<input data-bp="${k}" inputmode="numeric" value="${r.price}" placeholder="Precio" style="width:96px;border:1.5px solid var(--line);border-radius:10px;padding:8px">`}</div>`).join("")}</div>
  <button class="btn big">Poner a la venta</button>`:`<div class="empty">No hay insumos que se cuenten por unidades.</div>`}</form>`,sh=>{
  if(!rows.length)return;$("#fm",sh).onsubmit=e=>{e.preventDefault();let n=0,sinP=0;
   rows.forEach((r,k)=>{if(r.ya||!sh.querySelector(`[data-bk="${k}"]`).checked)return;const pr=num(sh.querySelector(`[data-bp="${k}"]`).value);if(!pr)sinP++;
    if(r.sim){const p=prod(r.sim.id);p.receta=[{iid:r.i.id,qty:1}];if(!p.cat||p.cat==="Otros")p.cat="Bebida";if(pr)p.price=pr;p.activo=true;p.upd=Date.now()}
    else S.products.push({id:uid("p"),name:r.i.name,cat:"Bebida",price:pr,activo:true,receta:[{iid:r.i.id,qty:1}],incluye:[],upd:Date.now()});n++});
   if(!n)return toast("No marcaste ninguna bebida.",true);saveCatalog("prod");closeModal();toast(`${n} ${n===1?"bebida quedó":"bebidas quedaron"} a la venta${sinP?` · ${sinP} sin precio`:""}`)}})}
function mCompra(pre,onDone){if(bloqueado())return;const provs=[...new Map(Object.values(S.days).flatMap(d=>vals(d.purchases)).map(p=>[norm(p.proveedor),p.proveedor]).filter(x=>x[0])).values()];
 openModal("Compra de insumos",`<form class="stack" id="fm"><label class="f"><span class="label">Insumo</span><select id="c_i" required><option value="">Escoge…</option>${insOpts(pre)}</select></label>
 <div class="fgrid"><label class="f"><span class="label">Cantidad</span><input id="c_q" inputmode="decimal" required></label><label class="f"><span class="label">Unidad</span><select id="c_u"></select></label><label class="f"><span class="label">Costo total</span><input id="c_c" inputmode="numeric" required></label></div>
 <div class="fgrid"><label class="f"><span class="label">Proveedor</span><input id="c_pr" list="provs" placeholder="Ej. salsamentaria"><datalist id="provs">${provs.map(p=>`<option value="${esc(p)}">`).join("")}</datalist></label><label class="f"><span class="label">Pagado con</span><select id="c_p">${payOpts("efectivo")}</select></label></div>
 <label class="row"><input type="checkbox" id="c_inv"> Es inversión o inventario inicial (suma al inventario, no cuenta en el balance del día)</label>
 <div class="small muted">Si se pagó con plata que no salió de la caja, elige "Fuera de caja" en "Pagado con".</div>
 <div class="small muted" id="c_info">¿No está el insumo? <button type="button" class="btn ghost" data-a="editI" style="padding:0">Créalo aquí</button></div><button class="btn big">Guardar compra</button></form>`,s=>{
  const upd=()=>{const i=ins($("#c_i",s).value);$("#c_u",s).innerHTML=unitsFor(i).map(u=>`<option>${esc(u)}</option>`).join("");if(presOf(i))$("#c_u",s).value=presOf(i).n};upd();$("#c_i",s).onchange=upd;
  $("#fm",s).onsubmit=e=>{e.preventDefault();const i=ins($("#c_i",s).value);const q=num($("#c_q",s).value),cost=num($("#c_c",s).value),u=$("#c_u",s).value;if(!i||!(q>0))return toast("Escoge el insumo y la cantidad.",true);
   const id=uid("c");let prov=$("#c_pr",s).value.trim();const match=provs.find(p=>norm(p)===norm(prov));if(match)prov=match;
   const rec={id,ts:Date.now(),hora:hora(),iid:i.id,name:i.name,qty:q,unitIn:u,qtyBase:q*factor(i,u),costo:cost,proveedor:prov,pago:$("#c_p",s).value,...($("#c_inv",s).checked?{inversion:true}:{}),...(onDone?{nota:"Comprado al momento para un pedido"}:{})};
   dayUpdate(S.date,{purchases:{[id]:rec}});closeModal();toast("Compra guardada y sumada al inventario");if(onDone)onDone(rec)}})}
function mEditCompra(id){const p=S.days[S.date]?.purchases?.[id];if(!p)return;
 openModal("Editar compra",`<form class="stack" id="fm"><p><b>${esc(ins(p.iid)?.name||p.name)}</b> · ${fmtQ(p.qtyBase,ins(p.iid)?.unit||p.unitIn)} · ${money(p.costo)}</p>

function mConteo(){if(bloqueado())return;const st=stockAll();openModal("Conteo físico",`<form class="stack" id="fm"><label class="f"><span class="label">Insumo</span><select id="k_i" required><option value="">Escoge…</option>${insOpts()}</select></label>
 <div class="small muted" id="k_sys">El sistema calcula lo que debería haber.</div><div class="fgrid"><label class="f"><span class="label">Contado</span><input id="k_r" inputmode="decimal" required></label><label class="f"><span class="label">Unidad</span><select id="k_u"></select></label></div>
 <div id="k_pend"></div><div class="small muted">✍️ Decimales con coma: 0,5 kg. Para mil gramos escribe 1000, sin punto.</div><label class="f"><span class="label">Nota</span><input id="k_n" placeholder="Posible causa"></label><button class="btn big">Guardar conteo</button></form>`,s=>{
 const upd=()=>{const i=ins($("#k_i",s).value);$("#k_u",s).innerHTML=unitsFor(i).map(u=>`<option>${esc(u)}</option>`).join("");$("#k_sys",s).textContent=i?`Según el sistema hay ${fmtP(st[i.id].actual,i)}.`:"El sistema calcula lo que debería haber.";const pq=i?pendQ(S.date)[i.id]||0:0;$("#k_pend",s).innerHTML=pq>0?`<label class="banner small row" style="gap:8px;flex-wrap:nowrap;margin:0"><input type="checkbox" id="k_pd" checked><span>${nPend(S.date,i.id)===1?"Hay 1 pedido en preparación que usa":"Hay "+nPend(S.date,i.id)+" pedidos en preparación que usan"} ${esc(i.name)} (${esc(fmtQ(pq,i.unit))}). La caja ya lo descontó. <b>Si todavía no los han preparado</b>, deja esto marcado y cuenta lo que hay.</span></label>`:""};upd();$("#k_i",s).onchange=upd;
 $("#fm",s).onsubmit=e=>{e.preventDefault();const i=ins($("#k_i",s).value);if(!i)return;const cont=num($("#k_r",s).value)*factor(i,$("#k_u",s).value);const pq=pendQ(S.date)[i.id]||0;const dp=pq>0&&$("#k_pd",s)&&$("#k_pd",s).checked;const r=cont-(dp?pq:0);if(raroConteo(i,r,st[i.id].actual)&&!confirm("⚠ "+i.name+" pasaría de "+fmtQ(Math.max(0,st[i.id].actual),i.unit)+" a "+fmtQ(r,i.unit)+". ¿Está bien?"))return;const id=uid("k");
  dayUpdate(S.date,{conteos:{[id]:{id,ts:Date.now(),iid:i.id,name:i.name,sistema:st[i.id].actual,real:r,nota:[$("#k_n",s).value.trim(),dp?"menos "+fmtQ(pq,i.unit)+" de pedidos en preparación":""].filter(Boolean).join(" · ")}}});closeModal();toast("Conteo guardado; el inventario quedó ajustado")}})}
function mCongelar(){const z=congelado();
 if(z)return mGuia(S.guiaPaso||1);
 openModal("Congelar inventario",`<div class="stack"><p>Mientras esté congelado:</p><ul style="margin:0;padding-left:18px"><li>Se vende normal y la plata se registra igual.</li><li><b>Las ventas no descuentan inventario</b> y no salen avisos de "no alcanza" ni "por comprar".</li><li>El cierre del día funciona igual que siempre: la caja tiene que cuadrar.</li><li>Los gastos del cuaderno se pueden pasar uno por uno o como un <b>total del día</b> (Caja del día → Gastos).</li></ul>
  <p class="small muted">Al descongelar, una guía los acompaña a revisar los insumos, contar lo que hay y revisar las recetas.</p><button class="btn big" id="cz_ok">❄ Congelar desde hoy</button></div>`,sh=>{
  $("#cz_ok",sh).onclick=()=>{S.cfg={...cfg(),congelado:{desde:S.date,ts:Date.now()}};S.guiaPaso=null;saveCfg();closeModal();toast("Inventario congelado")}})}
function descongelar(){S.cfg={...cfg(),congelado:null};S.guiaPaso=null;saveCfg();closeModal();toast("Inventario descongelado")}
function mGuia(p){const z=congelado();if(!z)return;S.guiaPaso=p;const T=["Antes de empezar","Revisar los insumos","Contar lo que hay","Revisar las recetas","Descongelar"],N=T.length;
 const dias=Object.keys(S.days).filter(k=>k>=z.desde);const nV=dias.reduce((a,k)=>a+vals(S.days[k].sales).filter(s=>activa(s)&&(s.items||[]).some(i=>i.noStock&&i.pid)).length,0);
 const conteoHecho=Object.values(S.days).flatMap(d=>vals(d.conteos)).filter(c=>c.nota==="Conteo completo"&&(+c.ts||0)>=(+z.ts||0)).sort((a,b)=>b.ts-a.ts)[0]||null;
 const act=S.products.filter(x=>x.activo!==false),sinRec=act.filter(x=>!(x.receta||[]).length&&!(x.incluye||[]).length);
 const head=`<div class="row between"><span class="chip gray">Paso ${p} de ${N} · ${T[p-1]}</span>${p<N?`<button type="button" class="btn ghost small" id="gu_ya">Descongelar ya</button>`:""}</div><div style="display:flex;gap:4px">${T.map((_,k)=>`<span style="flex:1;height:5px;border-radius:9px;background:${k<p?"var(--red)":"var(--line)"}"></span>`).join("")}</div>`;
 const nav=(txt)=>`<div class="row">${p>1?`<button type="button" class="btn sec" id="gu_b">Atrás</button>`:""}<button type="button" class="btn" id="gu_n" style="flex:1">${txt||"Siguiente"}</button></div>`;
 let body="",insEd=null;
 if(p===1)body=`<p>El inventario está congelado desde el <b>${fDate(z.desde,true)}</b>.${nV?` Se registraron <b>${nV} ${nV===1?"venta":"ventas"}</b> que no descontaron inventario.`:""}</p>
  <p>Esta guía los acompaña a dejar el inventario en orden antes de que las ventas vuelvan a descontar:</p>
  <ol style="margin:0;padding-left:20px"><li>Revisar la lista de insumos (quitar los que no se usan, poner mínimos).</li><li>Contar lo que hay físicamente.</li><li>Revisar las recetas de los productos.</li><li>Descongelar.</li></ol>
  <p class="small muted">Pueden saltar cualquier paso o tocar “Descongelar ya” en cualquier momento, aunque falten cosas. Si cierran esta ventana, al volver a tocar “Descongelar” siguen donde iban.</p>${nav("Empezar")}`;
 if(p===2){insEd=S.insumos.slice().sort((a,b)=>a.name.localeCompare(b.name,"es")).map(i=>({id:i.id,activo:i.activo!==false,min:+i.min||0}));
  body=`<p class="small muted">Desmarca los insumos que ya no se usan y escribe el <b>mínimo</b> (cuando el inventario baje de ahí, avisa “por comprar”). Para cambiar el nombre, la unidad o borrar uno, toca Editar.</p>

  <button type="button" class="btn ghost" id="gu_new">+ Nuevo insumo</button>${nav("Guardar y seguir")}`}
 if(p===3)body=`${conteoHecho?`<div class="banner" style="background:var(--green-soft);color:var(--green)">✓ Ya hicieron un conteo completo (${fDate(new Date(conteoHecho.ts-5*3600e3).toISOString().slice(0,10))}). Pueden seguir o volver a contar.</div>`:""}
  <p>Cuenten lo que hay <b>físicamente</b> de cada insumo. El inventario queda exactamente con esas cantidades y desde ahí arranca bien.</p>
  <button type="button" class="btn big y" id="gu_ct">${conteoHecho?"Volver a contar":"Hacer el conteo completo"}</button>
  <p class="small muted">Si no cuentan, el inventario sigue con los números de antes de congelar (las ventas de esos días no se descuentan).</p>${nav(conteoHecho?"Siguiente":"Saltar este paso")}`;
 if(p===4)body=`<p class="small muted">La receta dice qué insumos gasta cada producto; con eso el inventario se descuenta solo al vender. ${sinRec.length?`<b>${sinRec.length} ${sinRec.length===1?"producto no tiene":"productos no tienen"} receta.</b>`:"Todos los productos tienen receta."}</p>
  <div class="list">${act.slice().sort((a,b)=>((a.receta||[]).length||(a.incluye||[]).length?1:0)-((b.receta||[]).length||(b.incluye||[]).length?1:0)||a.name.localeCompare(b.name,"es")).map(x=>{const r=(x.receta||[]).length,c=(x.incluye||[]).length;return `<div class="li"><div class="grow"><div class="t">${esc(x.name)}</div><div class="small ${r||c?"muted":""}" style="${r||c?"":"color:var(--amber)"}">${r?`${r} insumos: ${esc(x.receta.map(q=>ins(q.iid)?.name||"").filter(Boolean).join(", "))}`:c?`Combo de ${c} productos`:"Sin receta (no descuenta inventario)"}</div></div><button type="button" class="btn ${r||c?"ghost":"sec"}" data-gp="${x.id}">${r||c?"Revisar":"Poner receta"}</button></div>`}).join("")}</div>${nav()}`;
 if(p===5){const row=(good,t,d)=>`<div class="chk ${good?"":"bad"}"><span class="ic">${good?"✓":"!"}</span><div class="grow"><b>${t}</b>${d?`<div class="small muted">${d}</div>`:""}</div></div>`;
  body=`<div>${row(true,`${S.insumos.filter(i=>i.activo!==false).length} insumos activos`,"")}
  ${row(!!conteoHecho,conteoHecho?"Conteo completo hecho":"Sin conteo completo","Pueden descongelar igual; el inventario sigue con los números de antes.")}

function poll(){if(!S.token||S.saving||document.visibilityState!=="visible")return;call("version").then(v=>{if(v!==S.version)refresh()}).catch(()=>{})}
setInterval(()=>{poll();if(!S.dateManual&&S.loaded.cfg&&S.date!==workDate()){S.date=workDate();render()}},10000);
document.addEventListener("visibilitychange",poll);
</script>
</body>
